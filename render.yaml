# Выкладка на Render: Dashboard → New → Blueprint → репозиторий FerrorNetwork/homePlan
services:
  - type: web
    name: dom-proekt
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: echo "без зависимостей"
    startCommand: node server.mjs
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: HOST
        value: 0.0.0.0
      - key: FEED_REFRESH_HOURS
        value: "24"
      # Секреты вводятся в панели Render при создании, в репозиторий не попадают
      - key: ADMIN_EMAILS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
